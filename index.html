<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>수학 마스터 🏆</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="수학마스터" />
  <meta name="theme-color" content="#0047ab" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <!-- 스타일 -->
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body>

<!-- ===== 시작 화면 ===== -->
<div id="screen-start" class="screen active">
  <div class="start-container">
    <div class="logo-area">
      <div class="logo-emoji">📐</div>
      <h1 class="logo-title">수학 마스터</h1>
      <p class="logo-sub">중학교 수학 레벨업 챌린지</p>
    </div>
    <div class="player-info-box" id="player-info-box">
      <div class="player-level-badge" id="start-level-badge">Lv.1</div>
      <div class="player-stats">
        <div class="stat-row"><span>현재 단원</span><span id="start-unit-name">중1 · 1학기</span></div>
        <div class="stat-row"><span>총 정답</span><span id="start-total-correct">0문제</span></div>
        <div class="stat-row"><span>획득 쿠폰</span><span id="start-coupon-count">0개</span></div>
      </div>
    </div>
    <button class="btn-primary" id="btn-start">학습 시작! 🚀</button>
    <button class="btn-install" id="btn-install" style="display:none;">📲 앱으로 설치하기</button>
    <button class="btn-secondary" id="btn-reset">처음부터 시작</button>
  </div>
</div>

<!-- ===== 문제 풀이 화면 ===== -->
<div id="screen-quiz" class="screen">

  <!-- 상단 헤더 -->
  <div class="quiz-header">
    <div class="header-left">
      <div class="level-badge" id="level-badge">Lv.1</div>
      <div class="unit-label" id="unit-label">중1 · 1학기</div>
    </div>
    <div class="header-center">
      <div class="streak-display" id="streak-display">
        <span class="streak-fire">🔥</span>
        <span id="streak-count">0</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-home" id="btn-home" title="홈으로">🏠</button>
    </div>
  </div>

  <!-- XP 바 -->
  <div class="xp-bar-container">
    <div class="xp-bar-track">
      <div class="xp-bar-fill" id="xp-bar-fill"></div>
    </div>
    <div class="xp-label" id="xp-label">XP 0 / 100</div>
  </div>

  <!-- 단원 진행 -->
  <div class="chapter-progress">
    <span id="chapter-name">소인수분해</span>
    <div class="chapter-dots" id="chapter-dots"></div>
    <span id="chapter-progress-text">0 / 0 마스터</span>
  </div>

  <!-- 문제 카드 -->
  <div class="question-card" id="question-card">
    <div class="question-tag" id="question-tag">소수와 합성수</div>
    <div class="question-type-badge" id="review-badge" style="display:none;">🔄 복습</div>
    <div class="question-text" id="question-text">문제가 로딩 중...</div>
  </div>

  <!-- 보기 영역 -->
  <div class="choices-area" id="choices-area">
    <button class="choice-btn" data-idx="0"></button>
    <button class="choice-btn" data-idx="1"></button>
    <button class="choice-btn" data-idx="2"></button>
    <button class="choice-btn" data-idx="3"></button>
  </div>

  <!-- 단답형 입력 -->
  <div class="short-answer-area" id="short-answer-area" style="display:none;">
    <input type="text" id="short-answer-input" class="short-input" placeholder="답을 입력하세요" />
    <button class="btn-submit" id="btn-submit">확인 ✓</button>
  </div>

  <!-- 피드백 영역 -->
  <div class="feedback-area" id="feedback-area" style="display:none;">
    <div class="feedback-icon" id="feedback-icon"></div>
    <div class="feedback-text" id="feedback-text"></div>
    <div class="explanation-box" id="explanation-box" style="display:none;">
      <div class="explanation-title">📖 풀이 과정</div>
      <div class="explanation-content" id="explanation-content"></div>
    </div>
    <div class="feedback-buttons">
      <button class="btn-explanation" id="btn-show-explanation" style="display:none;">풀이 보기 📖</button>
      <button class="btn-next" id="btn-next">다음 문제 →</button>
    </div>
  </div>

</div>

<!-- ===== 단원 완료 / 쿠폰 화면 ===== -->
<div id="screen-complete" class="screen">
  <div class="complete-container">
    <div class="confetti-area" id="confetti-area"></div>
    <div class="complete-emoji" id="complete-emoji">🎉</div>
    <h2 class="complete-title" id="complete-title">단원 완료!</h2>
    <p class="complete-subtitle" id="complete-subtitle"></p>

    <!-- 쿠폰 -->
    <div class="coupon-card" id="coupon-card" style="display:none;">
      <div class="coupon-top">
        <span class="coupon-label">🎁 보상 쿠폰 획득!</span>
      </div>
      <div class="coupon-emoji" id="coupon-emoji">🍕</div>
      <div class="coupon-text" id="coupon-text">아빠한테 피자 사달라고 하기</div>
      <div class="coupon-date" id="coupon-date"></div>
      <div class="coupon-no-expire">유효기간 없음 ♾️</div>
    </div>

    <!-- 통계 -->
    <div class="complete-stats">
      <div class="stat-box"><div class="stat-num" id="c-correct">0</div><div class="stat-lbl">정답</div></div>
      <div class="stat-box"><div class="stat-num" id="c-accuracy">0%</div><div class="stat-lbl">정답률</div></div>
      <div class="stat-box"><div class="stat-num" id="c-streak">0</div><div class="stat-lbl">최고 스트릭</div></div>
    </div>

    <button class="btn-primary" id="btn-continue">계속하기 🚀</button>
  </div>
</div>

<!-- ===== 레벨업 화면 ===== -->
<div id="screen-levelup" class="screen">
  <div class="levelup-container">
    <div class="levelup-stars">⭐⭐⭐</div>
    <div class="levelup-text">LEVEL UP!</div>
    <div class="levelup-badge" id="levelup-badge">Lv.2</div>
    <div class="levelup-desc" id="levelup-desc">중1 · 2학기로 진급!</div>
    <button class="btn-primary" id="btn-levelup-continue">계속하기 🎮</button>
  </div>
</div>

<!-- ===== 쿠폰 보관함 (모달) ===== -->
<div id="coupon-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🎁 쿠폰 보관함</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="coupon-list" id="coupon-list"></div>
    <p class="coupon-empty" id="coupon-empty" style="display:none;">아직 쿠폰이 없어요. 열심히 공부하면 생겨요! 💪</p>
  </div>
</div>

<!-- ===== 플로팅 버튼 ===== -->
<button class="fab-coupon" id="fab-coupon" title="쿠폰 보관함">🎁</button>

<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
